# Quality gate for every push and pull request.
# Must be green before merging. See docs/DEVELOPER_GUIDE.md -> "Definition of done".
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, rules, i18n, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Project rules
        run: npm run check:rules

      - name: i18n (en / ru in sync)
        run: npm run check:i18n

      - name: Web build
        run: npx vite build
